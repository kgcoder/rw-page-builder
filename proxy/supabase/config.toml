# Supabase CLI settings for deploying the example proxy (run the CLI from the proxy/ folder).

[functions.rw-proxy]
# Pages call the proxy without keys; ALLOWED_URLS in the function limits what it fetches.
verify_jwt = false

[functions.rw-comments]
# Pages call the bridge without keys; ALLOWED_FORUMS in the function limits what it serves.
verify_jwt = false
